<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alert - Error</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 400px;
      padding: 30px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #ff6b6b;
    }
    p {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .error-code {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 6px;
      margin: 15px 0;
      font-family: monospace;
      font-size: 0.85rem;
    }
    button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #ff5252;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚠️ Alert Error</h1>
    <p>
      The alert window failed to load.\n    </p>
    <p>
      Please reinstall the application to fix this issue.\n    </p>
    <div class="error-code">
      <strong>Error Details:</strong><br/>
      Alert file not found in build directory<br/>
      Reinstall recommended</div>
    <button onclick="window.close()">Close</button>
  </div>
</body>
</html>
