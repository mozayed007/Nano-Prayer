[package]
name = "nano-pray-reminder"
version = "0.1.6"
description = "A modern, lightweight Islamic prayer time reminder app"
authors = ["Muhammad Z. Ahmed"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-notification = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { workspace = true }

# Core library
nano-pray-core = { path = "../core" }

# Async runtime (minimal features)
tokio = { version = "1.0", features = ["time"] }

# Audio
rodio = { version = "0.19", default-features = false, features = ["mp3", "wav"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Windows API for WebView2 check
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
