name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace root is the repo root, target/ is at repo root
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install

      - name: Build Tauri app
        run: bun run tauri:build

      - name: Locate build artifacts
        shell: pwsh
        run: |
          Write-Host "=== Bundle search ==="
          Get-ChildItem -Path "." -Recurse -Filter "*_setup.exe" -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem -Path "." -Recurse -Filter "NanoPrayReminder.exe" -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== NSIS dir (workspace root target) ==="
          Get-ChildItem "target/release/bundle/nsis" -ErrorAction SilentlyContinue

      - name: Collect build artifacts
        id: artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          # NSIS bundler produces: ProductName_version_arch-setup.exe (hyphen before setup)
          # Use *setup.exe (no underscore requirement) to match both conventions
          $setupExe = Get-ChildItem "target/release/bundle/nsis" -Filter "*setup.exe" -ErrorAction SilentlyContinue |
                      Select-Object -First 1
          if (-not $setupExe) {
            $setupExe = Get-ChildItem -Path "." -Recurse -Filter "*setup.exe" -ErrorAction SilentlyContinue |
                        Select-Object -First 1
          }

          # Portable: Cargo package name is nano-pray-reminder, not NanoPrayReminder
          $portableExe = Get-Item "target/release/nano-pray-reminder.exe" -ErrorAction SilentlyContinue
          if (-not $portableExe) {
            $portableExe = Get-ChildItem "target/release" -Filter "*.exe" -ErrorAction SilentlyContinue |
                           Where-Object { $_.Name -notmatch "setup|uninstall|bun|cargo" } |
                           Select-Object -First 1
          }

          Write-Host "Setup exe:    $($setupExe.FullName)"
          Write-Host "Portable exe: $($portableExe.FullName)"

          if (-not $setupExe)    { Write-Error "Could not find setup exe!";    exit 1 }
          if (-not $portableExe) { Write-Error "Could not find portable exe!"; exit 1 }

          $setupName    = "NanoPrayReminder_${tag}_setup.exe"
          $portableName = "NanoPrayReminder_${tag}_portable.exe"

          Copy-Item $setupExe.FullName    $setupName
          Copy-Item $portableExe.FullName $portableName

          $setupHash    = (Get-FileHash $setupName    -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash $portableName -Algorithm SHA256).Hash
          "$setupHash  $setupName`n$portableHash  $portableName" | Set-Content SHA256SUMS.txt

          echo "setup=$setupName"       >> $env:GITHUB_OUTPUT
          echo "portable=$portableName" >> $env:GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace "^v", ""
          $content = Get-Content CHANGELOG.md -Raw
          # Extract the section for this version
          $pattern = "(?s)## \[$tag\][^\n]*\n(.+?)(?=\n## \[|\z)"
          if ($content -match $pattern) {
            $notes = $matches[1].Trim()
          } else {
            $notes = "See CHANGELOG.md for details."
          }
          $notes | Set-Content release_notes.txt
          echo "has_notes=$($notes -ne 'See CHANGELOG.md for details.')" >> $env:GITHUB_OUTPUT

      - name: Create source archives
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Create zip archive
          git archive --format=zip -o "Source-code-${tag}.zip" HEAD
          # Create tar.gz archive  
          git archive --format=tar.gz -o "Source-code-${tag}.tar.gz" HEAD
          Write-Host "Created source archives"
          Get-ChildItem "Source-code-*" | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ github.ref_name }}"
          body_path: release_notes.txt
          prerelease: true
          files: |
            ${{ steps.artifacts.outputs.setup }}
            ${{ steps.artifacts.outputs.portable }}
            SHA256SUMS.txt
            Source-code-*.zip
            Source-code-*.tar.gz
